<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Uptime Console</title>
<style>
  :root {
    --bg: #0b0e0c;
    --panel: #12160f;
    --line: #263021;
    --text: #d8e4d0;
    --dim: #6b7a63;
    --up: #7fd858;
    --down: #e5533d;
    --amber: #e3b341;
    --mono: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .eyebrow {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  .target {
    color: var(--dim);
    font-size: 13px;
    margin-bottom: 28px;
    word-break: break-all;
  }
  .config {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .config input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 4px;
  }
  .config button {
    background: var(--up);
    color: #0b0e0c;
    border: none;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 4px;
    cursor: pointer;
  }
  .status-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  .dot.up { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .dot.down { background: var(--down); box-shadow: 0 0 8px var(--down); }
  .status-label {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .status-sub {
    color: var(--dim);
    font-size: 12px;
    margin-left: auto;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px;
  }
  .stat .label {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .stat .value {
    font-size: 24px;
    font-weight: 600;
  }
  .stat .value.amber { color: var(--amber); }
  .log {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--dim);
    max-height: 160px;
    overflow-y: auto;
  }
  .log div { padding: 3px 0; border-bottom: 1px solid #1a2117; }
  .log div:last-child { border-bottom: none; }
  .log .ok { color: var(--up); }
  .log .fail { color: var(--down); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Reliability / Uptime Console</div>
  <h1>Service Status</h1>
  <div class="target" id="targetLabel">Not connected</div>

  <div class="config">
    <input id="baseUrl" placeholder="https://your-app.ghaymah.systems" />
    <button onclick="start()">Connect</button>
  </div>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <div class="status-label" id="statusLabel">—</div>
    <div class="status-sub" id="statusSub"></div>
  </div>

  <div class="grid">
    <div class="stat">
      <div class="label">Response Time</div>
      <div class="value" id="respTime">— ms</div>
    </div>
    <div class="stat">
      <div class="label">Total Requests</div>
      <div class="value amber" id="reqCount">—</div>
    </div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
  let intervalId = null;

  function logLine(text, ok) {
    const log = document.getElementById('log');
    const line = document.createElement('div');
    line.className = ok ? 'ok' : 'fail';
    const time = new Date().toLocaleTimeString();
    line.textContent = `[${time}] ${text}`;
    log.prepend(line);
    while (log.children.length > 30) log.removeChild(log.lastChild);
  }

  async function poll(base) {
    const dot = document.getElementById('dot');
    const statusLabel = document.getElementById('statusLabel');
    const statusSub = document.getElementById('statusSub');
    const respTime = document.getElementById('respTime');
    const reqCount = document.getElementById('reqCount');

    const start = performance.now();
    try {
      const res = await fetch(base.replace(/\/$/, '') + '/health', { cache: 'no-store' });
      const ms = Math.round(performance.now() - start);
      if (res.ok) {
        dot.className = 'dot up';
        statusLabel.textContent = 'HEALTHY';
        statusSub.textContent = 'last check ' + new Date().toLocaleTimeString();
        respTime.textContent = ms + ' ms';
        logLine(`/health → 200 (${ms} ms)`, true);
      } else {
        dot.className = 'dot down';
        statusLabel.textContent = 'DEGRADED';
        respTime.textContent = ms + ' ms';
        logLine(`/health → ${res.status}`, false);
      }
    } catch (e) {
      dot.className = 'dot down';
      statusLabel.textContent = 'DOWN';
      statusSub.textContent = 'unreachable';
      logLine('/health → unreachable', false);
    }

    try {
      const m = await fetch(base.replace(/\/$/, '') + '/metrics', { cache: 'no-store' });
      const data = await m.json();
      reqCount.textContent = data.request_count;
    } catch (e) { /* metrics optional */ }
  }

  function start() {
    const base = document.getElementById('baseUrl').value.trim();
    if (!base) return;
    document.getElementById('targetLabel').textContent = base;
    if (intervalId) clearInterval(intervalId);
    poll(base);
    intervalId = setInterval(() => poll(base), 5000);
  }
</script>
</body>
</html>
